const cv=document.getElementById('c'),ctx=cv.getContext('2d');const {W,H}=Q;const clamp=Q.clamp,eo=Q.eo,seg=Q.seg,ease=Q.ease;

// ---------- global noise fields ----------
const NZ=Q.makeNoise(21),NL=new Float32Array(W*H),NG=new Float32Array(W*H);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;NL[i]=NZ.fbm(x/150,y/150,4);const g=NZ.n(x/1.7+300,y/1.7)*.55+NZ.n(x/5+90,y/5+40)*.45;NG[i]=g*g*1.6;}

function chaikin(p,closed=true,it=2){for(let k=0;k<it;k++){const o=[];const n=p.length;for(let i=0;i<(closed?n:n-1);i++){const a=p[i],b=p[(i+1)%n];o.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75]);}if(!closed){o.unshift(p[0]);o.push(p[n-1]);}p=o;}return p;}
const ellP=(cx,cy,rx,ry,n=28,r=null,irr=0)=>{const p=[];for(let i=0;i<n;i++){const a=i/n*6.283,k=1+(r?(r()-.5)*irr:0);p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k]);}return p;};
const mirror=p=>p.map(q=>[1080-q[0],q[1]]).reverse();
function path(c,p,closed=true){c.beginPath();p.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));if(closed)c.closePath();}
function washMask(c,poly,seed,layers=34,alpha=.075,v=.35){const r=Q.rng(seed);const b=Q.deform(poly,1,v*.5,r);c.fillStyle='#fff';
  for(let i=0;i<layers;i++){const p=Q.deform(b,2,v*.55,r);path(c,p);c.globalAlpha=alpha;c.fill();}c.globalAlpha=1;}
function wc(drawMask,colA,colB,o={}){const m=mk(),mc=m.getContext('2d');drawMask(mc);
  if(o.grad){mc.globalCompositeOperation='destination-in';mc.fillStyle=o.grad(mc);mc.fillRect(0,0,W,H);mc.globalCompositeOperation='source-over';}
  const bl=mk(),bc=bl.getContext('2d');bc.filter=`blur(${o.blur||9}px)`;bc.drawImage(m,0,0);
  const [x0,y0,x1,y1]=(o.bb||[0,0,W,H]).map(Math.round);const w=x1-x0,h=y1-y0;
  const A=mc.getImageData(x0,y0,w,h),B=bc.getImageData(x0,y0,w,h).data,d=A.data;
  const ca=hex(colA),cb=hex(colB||colA),ox=o.ox||0,oy=o.oy||0,ek=o.edge??1.5,gr=o.gran??.45,st=o.str??1,cr=o.crisp??.6,mixS=o.mix??1;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const k=(j*w+i)*4;let a=d[k+3]/255;if(a<.004){d[k+3]=0;continue;}
    const X=(i+x0+ox)%W,Y=(j+y0+oy)%H,q=Y*W+X;const b=B[k+3]/255;
    const s=a<.12?0:a>.42?1:((a-.12)/.3)**2*(3-2*(a-.12)/.3);a=a*(1-cr)+s*cr;
    const nl=NL[q];let den=a*(.5+.55*nl)+Math.max(0,a-b)*ek;den*=(1-gr)+gr*1.25*NG[q];den=Math.min(1,den*st);

// graphite pencil line
function graphite(c,p,seed,o={}){const r=Q.rng(seed);const w=o.w||2.2,al=o.a||.62,j=o.j??1.1;c.save();c.lineCap='round';c.lineJoin='round';
  for(let pass=0;pass<2;pass++){let drawing=true;c.beginPath();let started=false;const n=p.length+(o.closed===false?0:1);
    for(let i=0;i<n;i++){const q=p[i%p.length];if(o.gaps&&r()<o.gaps){drawing=!drawing;started=false;}const x=q[0]+(r()-.5)*j*2,y=q[1]+(r()-.5)*j*2;
      if(!drawing)continue;if(!started){c.moveTo(x,y);started=true;}else c.lineTo(x,y);}
    c.strokeStyle=`rgba(58,44,40,${pass?al*.45:al})`;c.lineWidth=pass?w*.55:w;c.stroke();}c.restore();}

const PAPER=mk(),GRAIN=mk();{const pc=PAPER.getContext('2d'),gc=GRAIN.getContext('2d'),pd=pc.createImageData(W,H),gd=gc.createImageData(W,H),r=Q.rng(5);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,k=i*4;const n=NL[(i+517*W)%(W*H)]-.5;const vy=y/H;

const G={head:ellP(540,860,80,86,40),hood:ellP(540,866,114,122,40),

function buildChild(){const C=mk(),c=C.getContext('2d');

  add(wc(m=>{m.save();m.beginPath();[G.coat,G.armL,G.armR,G.hood].forEach(p=>{p.forEach((q,i)=>i?m.lineTo(q[0],q[1]):m.moveTo(q[0],q[1]));m.closePath();});m.clip();washMask(m,chaikin([[606,990],[668,1000],[700,1262],[612,1270],[596,1120]]),5,30,.07,.3);
    washMask(m,ellP(540,985,92,24,18),6,26,.07,.4);washMask(m,ellP(540,1258,168,20,18),7,26,.06,.3);
    washMask(m,chaikin([[436,1010],[456,1012],[444,1192],[426,1190]]),8,22,.07,.3);washMask(m,chaikin([[648,1010],[676,1004],[692,1190],[650,1192]]),9,26,.08,.3);
    
    washMask(m,ellP(540,866,100,110,30),12,30,.07,.25);m.restore();m.globalCompositeOperation='destination-out';m.filter='blur(3px)';path(m,ellP(540,860,84,90,40));m.fill();m.filter='none';m.globalCompositeOperation='source-over';},'#c9851b','#b9661a',{bb:bbC,ox:200,edge:2,str:.62}));

  add(wc(m=>{washMask(m,chaikin([[506,1262],[530,1260],[536,1390],[506,1392]],true,1),17,20,.08,.2);washMask(m,chaikin([[584,1262],[608,1260],[618,1390],[586,1392]],true,1),18,20,.08,.2);},'#8f2a24',null,{bb:[440,1240,640,1410],str:.7}));
  // face skin
  add(wc(m=>washMask(m,G.head,19,36,.08,.18),'#f9dcc4','#f4c6a6',{bb:[440,760,640,960],grad:m=>LIGHT(m,510,830,10,120,.6),edge:1.2,gran:.25}));
  add(wc(m=>{m.save();path(m,G.head);m.clip();washMask(m,ellP(600,900,46,70,20),20,22,.07,.3);m.restore();},'#e8ad8c',null,{bb:[440,760,640,960],str:.45,gran:.2}));

  add(wc(m=>{washMask(m,G.hair,23,36,.085,.15);m.globalCompositeOperation='destination-out';m.filter='blur(6px)';m.lineWidth=16;m.strokeStyle='rgba(0,0,0,.55)';m.beginPath();m.arc(540,858,72,-2.55,-1.75);m.stroke();m.filter='none';m.globalCompositeOperation='source-over';},'#3d2a22','#6a4636',{bb:[430,740,650,930],edge:1.4,gran:.5}));
  c.globalCompositeOperation='source-over';
  // toggles + collar details (gouache)
  [1030,1100,1170].forEach((y,i)=>{c.fillStyle='#7a4a24';c.beginPath();c.ellipse(552,y,7,13,.2,0,7);c.fill();c.fillStyle='rgba(255,240,210,.5)';c.beginPath();c.ellipse(550,y-4,2.5,4,.2,0,7);c.fill();});

function buildPencil(seed){const C=mk(),c=C.getContext('2d');const o={w:2.3,a:.55,gaps:.04,j:.9};
  graphite(c,G.hood,seed+1,o);graphite(c,G.coat,seed+2,o);graphite(c,G.armL,seed+3,o);graphite(c,G.armR,seed+4,o);graphite(c,G.bootL,seed+5,o);graphite(c,G.bootR,seed+6,o);
  graphite(c,G.head,seed+7,{...o,w:2,gaps:.06});graphite(c,G.hair,seed+8,{...o,w:1.8,a:.45});
  graphite(c,[[540,958],[540,1270]],seed+9,{w:1.6,a:.4,closed:false});graphite(c,[[486,950],[540,986],[594,950]],seed+10,{w:1.8,a:.45,closed:false});
  graphite(c,[[432,1150],[492,1150]],seed+11,{w:1.6,a:.4,closed:false});graphite(c,[[588,1150],[648,1150]],seed+12,{w:1.6,a:.4,closed:false});
  graphite(c,[[468,1300],[531,1298]],seed+13,{w:1.4,a:.35,closed:false});graphite(c,[[549,1298],[612,1300]],seed+14,{w:1.4,a:.35,closed:false});

function buildHand(fist){const C=mk(),c=C.getContext('2d');const ps=[[414,1212],[666,1212]].map(([x,y])=>fist?ellP(x,y+2,27,24,24):chaikin([[x-22,y-22],[x+20,y-22],[x+24,y+6],[x+12,y+30],[x-12,y+30],[x-24,y+6]]));

  c.drawImage(wc(m=>ps.forEach((p,i)=>washMask(m,p,40+i+(fist?5:0),26,.09,.15)),'#f4c7a3','#e9ab86',{bb:[360,1160,720,1270],grad:m=>LIGHT(m,540,1190,40,200,.7)}),0,0);
  c.globalCompositeOperation='source-over';ps.forEach((p,i)=>graphite(c,p,70+i,{w:2,a:.55}));
  if(fist)[[414,1212],[666,1212]].forEach(([x,y],i)=>{for(let k=0;k<3;k++)graphite(c,[[x-14+k*11,y-10],[x-12+k*11,y+4]],80+i*5+k,{w:1.4,a:.45,closed:false});});

// ---------- flame ----------
const flameP=(cx,by,w,h,n,r,lean=0)=>{const p=[];for(let i=0;i<n;i++){const a=i/n*6.283;const s=Math.sin(a),c=Math.cos(a);const u=(1-c)/2;const y=by-h*u;
  const ww=w*Math.pow(Math.sin(Math.PI*(u*0.96+0.04)),1.15)*(1-.25*u);p.push([cx+s*ww*(1+(r()-.5)*.35)+lean*u*u*h,y+(r()-.5)*22]);}return p;};
function buildFlame(seed){const r=Q.rng(seed),L=(r()-.5)*.25;const bb=[150,250,930,1250];
  const tongues=[[540,1160,300,760,'#f6b26a','#f3c67c',.9,1],[500,1140,180,600,'#ef7d4c','#f29a55',1,2],[600,1140,180,660,'#e9643f','#ef7a48',1,3],[545,1130,150,520,'#d9412f','#e8603a',1,4],[560,1110,90,330,'#b8262b','#d23a2e',.9,5]];
  const ts=tongues.map(([x,y,w,h,a,b,s,k])=>wc(m=>{washMask(m,flameP(x+(r()-.5)*24,y,w,h,18,r,L*(1+k*.2)),seed*10+k,30,.07,.4);},a,b,{bb,ox:seed*97+k*31,oy:seed*53,edge:1.9,str:s,gran:.5}));
  const sp=mk(),sc=sp.getContext('2d');for(let i=0;i<90;i++){const a=r()*6.283,d=150+r()*330;const x=540+Math.cos(a)*d*.8,y=760+Math.sin(a)*d;const rr=r()<.85?r()*4+1:r()*8+4;
    sc.fillStyle=`rgba(${205+r()*40|0},${70+r()*70|0},${45+r()*20|0},${.3+r()*.45})`;sc.beginPath();sc.arc(x,y,rr,0,7);sc.fill();}

const FRONT=mk(W,H*2);{const c=FRONT.getContext('2d'),id=c.createImageData(W,H*2);for(let x=0;x<W;x++){const e=H+ (NZ.fbm(x/170+40,3,4)-.5)*190;for(let y=0;y<H*2;y++){const k=(y*W+x)*4;const a=1-sm(e-40,e+30,y);id.data[k]=id.data[k+1]=id.data[k+2]=255;id.data[k+3]=a*255;}}c.putImageData(id,0,0);}

function buildHeart(){const p=[];for(let i=0;i<40;i++){const a=i/40*6.283;p.push([16*Math.pow(Math.sin(a),3),-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))]);}
  const sp=p.map(q=>[540+q[0]*2.6,540+q[1]*2.6]);return [wc(m=>washMask(m,sp,81,28,.09,.15),'#e2483a','#c8302e',{bb:[440,460,640,620],edge:2}),sp];}
