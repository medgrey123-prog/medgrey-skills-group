<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="common.js"></script>
<script>
// Style: 博物图版 — museum plate / editorial print: paper, engraving hatch, hand-tinted wash, Swiss grid, real absorption chart.
const cv=document.getElementById('c'),ctx=cv.getContext('2d');const {W,H}=Q;const UI=location.search.includes('ui=1');
const INK='#1d2622',RED='#c8452c',BLUE='#2b4fa8',GREEN='#3f8a4a';
const N=Q.makeNoise(4);
// paper texture (static)
const paper=document.createElement('canvas');paper.width=W;paper.height=H;{const p=paper.getContext('2d');const id=p.createImageData(W,H),d=id.data;const r=Q.rng(3);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;const n=N.fbm(x/220,y/220,4)*14+N.n(x/3,y/3)*5+(r()-.5)*6;
  const vx=(x-W/2)/W,vy=(y-H/2)/H;const v=1-(vx*vx+vy*vy)*0.35;
  d[i]=(243+n-8)*v;d[i+1]=(236+n-8)*v;d[i+2]=(222+n-10)*v;d[i+3]=255;}
 p.putImageData(id,0,0);
 // fibres
 p.globalAlpha=.06;p.strokeStyle='#6b5a40';for(let k=0;k<500;k++){const x=r()*W,y=r()*H,a=r()*6.28,l=10+r()*30;p.lineWidth=.6;p.beginPath();p.moveTo(x,y);p.quadraticCurveTo(x+Math.cos(a)*l*.5+r()*6,y+Math.sin(a)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);p.stroke();}
}
const LEAF={x:440,y:930,L:490,Wd:178,a:-0.6};
function toW(lx,ly){const c=Math.cos(LEAF.a),s=Math.sin(LEAF.a);return [LEAF.x+lx*c-ly*s,LEAF.y+lx*s+ly*c];}
function line(x0,y0,x1,y1,p=1){ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0+(x1-x0)*p,y0+(y1-y0)*p);ctx.stroke();}
function arrowHead(x,y,ang,s=14){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-s*Math.cos(ang-.35),y-s*Math.sin(ang-.35));ctx.lineTo(x-s*Math.cos(ang+.35),y-s*Math.sin(ang+.35));ctx.closePath();ctx.fill();}
const gauss=(x,m,s)=>Math.exp(-((x-m)**2)/(2*s*s));
const chlA=nm=>.95*gauss(nm,430,14)+.5*gauss(nm,412,12)+.78*gauss(nm,662,10)+.22*gauss(nm,618,14)+.05*gauss(nm,560,60);
const chlB=nm=>.97*gauss(nm,455,13)+.35*gauss(nm,430,16)+.55*gauss(nm,642,10)+.12*gauss(nm,595,16)+.04*gauss(nm,540,60);
function T(s,x,y,font,col,align='left'){ctx.font=font;ctx.fillStyle=col;ctx.textAlign=align;ctx.fillText(s,x,y);}
window.render=function(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.drawImage(paper,0,0);
  const M=80;// margin
  const pBeam=Q.eo(Q.seg(t,0,1.4)),pFan=Q.eo(Q.seg(t,1.2,2.6)),pRef=Q.eo(Q.seg(t,2.8,3.8)),pChart=Q.eo(Q.seg(t,3.0,4.6)),pLeaf=Q.eo(Q.seg(t,0,1));
  // header
  T('趣米博物馆  ·  自然科学',M,150,'500 26px "Noto Sans CJK SC"',INK);
  T('PLATE  No. 01',W-M-60,150,'500 24px "IBM Plex Mono"','rgba(29,38,34,.7)','right');
  ctx.fillStyle=INK;ctx.fillRect(M,172,W-2*M-60,2.5);ctx.fillRect(M,180,W-2*M-60,.8);
  T('叶子为什么',M,280,'900 92px "Noto Serif CJK SC"',INK);
  T('是绿的？',M,385,'900 92px "Noto Serif CJK SC"',INK);
  T('Why are leaves green? — on light & chlorophyll',M,440,'italic 500 34px "Cormorant Garamond"','rgba(29,38,34,.75)');
  // ---------- Fig.1 illustration ----------
  // leaf hand-tinted wash (watercolour-ish, slightly offset from line work)
  ctx.save();ctx.translate(LEAF.x+6,LEAF.y+4);ctx.rotate(LEAF.a);ctx.globalAlpha=.85*pLeaf;
  ctx.filter='blur(2px)';Q.leaf(ctx,LEAF.L,LEAF.Wd);let g=ctx.createLinearGradient(0,-LEAF.Wd,0,LEAF.Wd);g.addColorStop(0,'rgba(120,170,90,.55)');g.addColorStop(1,'rgba(70,130,70,.65)');ctx.fillStyle=g;ctx.fill();ctx.filter='none';
  // wash blotches
  ctx.save();Q.leaf(ctx,LEAF.L,LEAF.Wd);ctx.clip();const r=Q.rng(8);for(let i=0;i<40;i++){ctx.fillStyle=`rgba(${60+r()*40},${110+r()*40},60,.08)`;ctx.beginPath();ctx.arc(r()*LEAF.L,(r()-.5)*2*LEAF.Wd,30+r()*60,0,7);ctx.fill();}
  ctx.restore();ctx.restore();
  // leaf line work
  ctx.save();ctx.translate(LEAF.x,LEAF.y);ctx.rotate(LEAF.a);ctx.globalAlpha=pLeaf;
  ctx.strokeStyle=INK;ctx.lineWidth=2.6;ctx.lineJoin='round';Q.leaf(ctx,LEAF.L,LEAF.Wd);ctx.stroke();
  // engraving hatch on lower half (shadow side)
  ctx.save();Q.leaf(ctx,LEAF.L,LEAF.Wd);ctx.clip();ctx.beginPath();ctx.rect(-10,0,LEAF.L+20,LEAF.Wd+10);ctx.clip();
  ctx.lineWidth=.8;ctx.strokeStyle='rgba(29,38,34,.4)';for(let x=-200;x<LEAF.L+200;x+=7){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x-120,LEAF.Wd);ctx.stroke();}
  ctx.restore();
  ctx.save();Q.leaf(ctx,LEAF.L,LEAF.Wd);ctx.clip();ctx.beginPath();ctx.rect(LEAF.L*.45,10,LEAF.L,LEAF.Wd);ctx.clip();
  ctx.lineWidth=.7;ctx.strokeStyle='rgba(29,38,34,.4)';for(let x=-200;x<LEAF.L+300;x+=8){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+110,LEAF.Wd);ctx.stroke();}
  ctx.restore();
  ctx.save();Q.leaf(ctx,LEAF.L,LEAF.Wd);ctx.clip();ctx.strokeStyle=INK;ctx.lineCap='round';Q.strokeVeins(ctx,Q.leafVeins(LEAF.L,LEAF.Wd,8,5),3.2);ctx.restore();
  // petiole
  ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-30,4,-60,22);ctx.stroke();
  ctx.restore();
  // prism (line drawing + hatch on shaded face)
  const px=235,py=600,s=100;const A=[px,py-s],B=[px+s*.95,py+s*.6],C=[px-s*.95,py+s*.6];
  ctx.save();ctx.beginPath();ctx.moveTo(...A);ctx.lineTo(...B);ctx.lineTo(...C);ctx.closePath();ctx.fillStyle='rgba(255,255,255,.35)';ctx.fill();ctx.clip();
  ctx.strokeStyle='rgba(29,38,34,.35)';ctx.lineWidth=.8;for(let k=-200;k<200;k+=6){ctx.beginPath();ctx.moveTo(px+k,py+s);ctx.lineTo(px+k+60,py-s);ctx.stroke();}ctx.restore();
  ctx.strokeStyle=INK;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(...A);ctx.lineTo(...B);ctx.lineTo(...C);ctx.closePath();ctx.stroke();
  // white light: double ink line
  const in0=[M-30,505],in1=[px-46,py+8];
  ctx.strokeStyle=INK;ctx.lineWidth=1.6;ctx.save();ctx.translate(0,-5);line(...in0,...in1,pBeam);ctx.translate(0,10);line(...in0,...in1,pBeam);ctx.restore();
  T('白光',M+10,585,'600 26px "Noto Sans CJK SC"',INK);
  // spectrum lines from exit to leaf
  const ex=[px+42,py+18];
  const tgt=nm=>{const u=.12+.7*(nm-400)/300;return toW(LEAF.L*u,-Q.leafHalf(u,LEAF.Wd)*.2);};
  const ray=[[680,RED,'红光'],[600,'#d8892a',''],[575,'#c9b437',''],[535,GREEN,'绿光'],[490,'#2f8a9a',''],[455,BLUE,'蓝光'],[415,'#5a3d8e','']];
  ray.forEach(([nm,c,l])=>{const [tx,ty]=tgt(nm);ctx.strokeStyle=c;ctx.lineWidth=l?3:1.6;ctx.globalAlpha=l?1:.8;line(...ex,tx,ty,pFan);ctx.globalAlpha=1;});
  // absorption marks: open circle + label with leader
  const mark=(nm,c,txt,dx,dy)=>{const [x,y]=tgt(nm);ctx.globalAlpha=Q.eo(Q.seg(t,2.4,3));ctx.strokeStyle=c;ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.stroke();ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();
    ctx.lineWidth=1.2;ctx.strokeStyle=INK;line(x+dx*.12,y+dy*.12,x+dx,y+dy);T(txt,x+dx+(dx>0?10:-10),y+dy+9,'600 28px "Noto Sans CJK SC"',c,dx>0?'left':'right');ctx.globalAlpha=1;};
  mark(680,RED,'红光 · 被吸收',-40,-110);mark(455,BLUE,'蓝光 · 被吸收',-120,120);
  // green reflected: dashed ink arrow to the eye (left margin)
  const [gx,gy]=tgt(535);const eye=[M+70,1090];
  ctx.strokeStyle=GREEN;ctx.lineWidth=3;ctx.setLineDash([14,9]);line(gx,gy,...eye,pRef);ctx.setLineDash([]);
  if(pRef>.98){ctx.fillStyle=GREEN;arrowHead(eye[0]+30,eye[1]-14,Math.atan2(eye[1]-gy,eye[0]-gx),22);}
  ctx.globalAlpha=pRef;ctx.save();ctx.translate(eye[0],eye[1]+10);ctx.strokeStyle=INK;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(-44,0);ctx.quadraticCurveTo(0,-34,44,0);ctx.quadraticCurveTo(0,34,-44,0);ctx.stroke();ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fillStyle=GREEN;ctx.fill();ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fillStyle=INK;ctx.fill();ctx.restore();
  T('绿光 · 被弹回眼睛',M,1160,'600 28px "Noto Sans CJK SC"',GREEN);ctx.globalAlpha=1;
  T('图 1',W-M-60,505,'500 24px "IBM Plex Mono"','rgba(29,38,34,.6)','right');
  // ---------- Fig.2 absorption chart ----------
  const cx0=M+40,cx1=W-M-80,cy0=1250,cy1=1370;// plot box
  ctx.globalAlpha=1;ctx.strokeStyle=INK;ctx.lineWidth=1.4;line(cx0,cy1,cx1,cy1);line(cx0,cy0-20,cx0,cy1);
  T('图 2  叶绿素吸收光谱',M,1220,'600 26px "Noto Sans CJK SC"',INK);
  T('ABSORBANCE',cx1,1220,'500 20px "IBM Plex Mono"','rgba(29,38,34,.55)','right');
  const X=nm=>cx0+(cx1-cx0)*(nm-400)/300;
  // spectrum strip
  for(let nm=400;nm<700;nm+=1){ctx.fillStyle=`rgb(${Q.wl(nm).map(v=>Math.round(v*.62+80)).join(',')})`;ctx.fillRect(X(nm),cy1+6,(cx1-cx0)/300+1,10);}
  [400,500,600,700].forEach(nm=>T(nm+'',X(nm),cy1+46,'500 20px "IBM Plex Mono"','rgba(29,38,34,.65)','center'));
  // green gap
  ctx.fillStyle='rgba(63,138,74,.12)';ctx.fillRect(X(500),cy0-20,X(600)-X(500),cy1-cy0+20);
  T('绿光几乎不被吸收',X(550),cy0+20,'600 22px "Noto Sans CJK SC"',GREEN,'center');
  const curve=(f,c,w)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();const end=400+300*pChart;for(let nm=400;nm<=end;nm+=1){const y=cy1-(cy1-cy0+10)*f(nm);nm==400?ctx.moveTo(X(nm),y):ctx.lineTo(X(nm),y);}ctx.stroke();};
  curve(chlA,INK,2.6);ctx.setLineDash([6,5]);curve(chlB,INK,1.8);ctx.setLineDash([]);
  T('— 叶绿素 a   - - 叶绿素 b   单位：nm',cx0+6,cy1+80,'500 20px "Noto Sans CJK SC"','rgba(29,38,34,.7)');
  // ---------- caption ----------
  ctx.fillStyle=INK;ctx.fillRect(M,1478,40,3);
  T('红光、蓝光被叶绿素吃掉，',M,1535,'700 44px "Noto Serif CJK SC"',INK);
  ctx.font='700 44px "Noto Serif CJK SC"';const a='绿光';ctx.fillStyle=GREEN;ctx.fillText(a,M,1597);const w=ctx.measureText(a).width;ctx.fillStyle=INK;ctx.fillText('被弹回了我们的眼睛。',M+w,1597);
  if(UI)Q.ui(ctx,false);
};
</script></body></html>
