const bubbles=[];{const r=Q.rng(3);for(let i=0;i<12;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.04+r()*.06,16,12),bm);breath.add(m);bubbles.push([m,r(),r(),r()]);}}
