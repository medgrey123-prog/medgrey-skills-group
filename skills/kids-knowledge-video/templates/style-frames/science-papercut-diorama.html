<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="common.js"></script>
<script>
// Style: 纸雕层叠 — layered paper-craft diorama: real paper grain, stacked depth shadows, warm crafted palette.
const cv=document.getElementById('c'),ctx=cv.getContext('2d');const {W,H}=Q;const UI=location.search.includes('ui=1');
const N=Q.makeNoise(21);
const grain=document.createElement('canvas');grain.width=512;grain.height=512;{const g=grain.getContext('2d');const id=g.createImageData(512,512),d=id.data;const r=Q.rng(9);
 for(let y=0;y<512;y++)for(let x=0;x<512;x++){const i=(y*512+x)*4;const v=200+N.fbm(x/18,y/18,3)*40+(r()-.5)*30+N.n(x/2,y/60)*10;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}g.putImageData(id,0,0);}
let pat=null;
function paper(path,col,depth=10,edge=true){
  ctx.save();ctx.shadowColor='rgba(60,35,20,.28)';ctx.shadowBlur=depth*2.2;ctx.shadowOffsetX=depth*.35;ctx.shadowOffsetY=depth*.9;path();ctx.fillStyle=col;ctx.fill();ctx.restore();
  ctx.save();path();ctx.clip();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.22;ctx.fillStyle=pat;ctx.fillRect(0,0,W,H);ctx.restore();
  if(edge){ctx.save();path();ctx.clip();ctx.translate(2,2.5);path();ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.stroke();ctx.restore();}
}
const SUN={x:850,y:600},PR={x:650,y:770},LEAF={x:110,y:1360,L:560,Wd:185,a:-0.42};
function toW(lx,ly){const c=Math.cos(LEAF.a),s=Math.sin(LEAF.a);return [LEAF.x+lx*c-ly*s,LEAF.y+lx*s+ly*c];}
function strip(x0,y0,x1,y1,w0,w1,col,depth,p=1){const X=x0+(x1-x0)*p,Y=y0+(y1-y0)*p;const dx=X-x0,dy=Y-y0,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;const w=w0+(w1-w0)*p;
  paper(()=>{ctx.beginPath();ctx.moveTo(x0+nx*w0,y0+ny*w0);ctx.lineTo(X+nx*w,Y+ny*w);ctx.lineTo(X-nx*w,Y-ny*w);ctx.lineTo(x0-nx*w0,y0-ny*w0);ctx.closePath();},col,depth,false);}
function hills(y0,amp,f,ph,col,depth){paper(()=>{ctx.beginPath();ctx.moveTo(-40,H+40);for(let x=-40;x<=W+40;x+=8)ctx.lineTo(x,y0+Math.sin(x/f+ph)*amp+Math.sin(x/(f*.37)+ph*1.7)*amp*.3);ctx.lineTo(W+40,H+40);ctx.closePath();},col,depth);}
window.render=function(t){
  ctx.setTransform(1,0,0,1,0,0);if(!pat)pat=ctx.createPattern(grain,'repeat');
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f6ecdc');g.addColorStop(1,'#efdcc2');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.25;ctx.fillStyle=pat;ctx.fillRect(0,0,W,H);ctx.restore();
  // sun discs
  const b=Math.sin(t*1.5)*4;[[230,'#f8d9a0',6],[180,'#f6c46e',10],[132,'#f3a64a',14],[92,'#ef8a3a',18]].forEach(([r,c,d])=>paper(()=>{ctx.beginPath();ctx.arc(SUN.x,SUN.y+b*(d/18),r,0,7);},c,d));
  // distant hills
  hills(1240,30,240,.8,'#bcd3b4',8);hills(1330,36,200,2.1,'#93bf98',12);
  const pIn=Q.eo(Q.seg(t,0,1.2)),pFan=Q.eo(Q.seg(t,1,2.4)),pRef=Q.eo(Q.seg(t,3,4.2));
  // white paper beam: sun -> prism
  strip(SUN.x-40,SUN.y+50,PR.x+10,PR.y-10,30,22,'#fffaf0',14,pIn);
  // prism: two-tone paper triangle
  const s=105;paper(()=>{ctx.beginPath();ctx.moveTo(PR.x,PR.y-s);ctx.lineTo(PR.x+s*.95,PR.y+s*.62);ctx.lineTo(PR.x-s*.95,PR.y+s*.62);ctx.closePath();},'#d9ecf2',18);
  paper(()=>{ctx.beginPath();ctx.moveTo(PR.x,PR.y-s);ctx.lineTo(PR.x+s*.95,PR.y+s*.62);ctx.lineTo(PR.x+s*.15,PR.y+s*.62);ctx.closePath();},'#b9dbe6',4,false);
  // leaf: two stacked paper layers + cut veins
  ctx.save();ctx.translate(LEAF.x,LEAF.y);ctx.rotate(LEAF.a);
  paper(()=>{ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-60,10,-110,70);ctx.lineTo(-100,78);ctx.quadraticCurveTo(-50,20,4,8);ctx.closePath();},'#3f7d45',8);
  paper(()=>Q.leaf(ctx,LEAF.L,LEAF.Wd),'#2f7a45',22);
  paper(()=>{ctx.save();ctx.translate(LEAF.L*.04,0);ctx.scale(.93,.86);Q.leaf(ctx,LEAF.L,LEAF.Wd);ctx.restore();},'#5aa85a',8);
  ctx.save();Q.leaf(ctx,LEAF.L*.97,LEAF.Wd*.86);ctx.clip();ctx.lineCap='round';
  const vs=Q.leafVeins(LEAF.L,LEAF.Wd,7,4).filter(v=>v.w>.3);ctx.translate(0,3);ctx.strokeStyle='rgba(20,70,35,.45)';Q.strokeVeins(ctx,vs,7);ctx.translate(0,-3);ctx.strokeStyle='#8ccf7d';Q.strokeVeins(ctx,vs,5);ctx.restore();
  ctx.restore();
  // spectrum strips fan to leaf
  const tgt=nm=>{const u=.22+.62*(nm-400)/300;return toW(LEAF.L*u,-Q.leafHalf(u,LEAF.Wd)*.25);};
  const ex=[PR.x-40,PR.y+40];
  const cols=[[680,'#e8533f',14],[600,'#f29b38',7],[575,'#f2cf4a',7],[530,'#47a85a',14],[490,'#3fb3b8',7],[455,'#3d64c8',14],[420,'#7552b3',7]];
  cols.forEach(([nm,c,w])=>{const [x,y]=tgt(nm);strip(ex[0],ex[1],x,y,w*.5,w,c,10,pFan);});
  // red/blue absorbed: paper bursts on leaf
  const pAbs=Q.eo(Q.seg(t,2.3,3));[[tgt(680),'#e8533f'],[tgt(455),'#3d64c8']].forEach(([[x,y],c],i)=>{const k=pAbs*(1+.06*Math.sin(t*5+i));
    paper(()=>{ctx.beginPath();for(let j=0;j<16;j++){const a=j/16*6.283+t*.3,r=(j%2?20:42)*k;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();},c,6);
    paper(()=>{ctx.beginPath();ctx.arc(x,y,12*k,0,7);},'#fff7e6',3,false);});
  // green strip bounces out to the viewer (left)
  const [gx,gy]=tgt(530);const eye=[150,930];strip(gx,gy,eye[0],eye[1],14,26,'#47a85a',16,pRef);
  // eye token
  if(pRef>.05){ctx.globalAlpha=Q.eo(Q.seg(t,3.8,4.4));paper(()=>{ctx.beginPath();ctx.arc(eye[0],eye[1],62,0,7);},'#fff9ef',14);
    ctx.save();ctx.translate(eye[0],eye[1]);ctx.strokeStyle='#2a2a2a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-38,0);ctx.quadraticCurveTo(0,-30,38,0);ctx.quadraticCurveTo(0,30,-38,0);ctx.stroke();ctx.fillStyle='#47a85a';ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fill();ctx.fillStyle='#2a2a2a';ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill();ctx.restore();ctx.globalAlpha=1;}
  // foreground hills
  hills(1430,26,170,.3,'#5f9c6a',16);hills(1560,22,220,1.4,'#3f7f55',20);
  // labels as small paper tags
  const tag=(x,y,txt,c,a)=>{ctx.globalAlpha=a;ctx.font='700 28px "Noto Sans CJK SC"';const w=ctx.measureText(txt).width+40;paper(()=>{ctx.beginPath();ctx.roundRect(x,y-38,w,54,8);},'#fffaf0',8);ctx.fillStyle=c;ctx.fillText(txt,x+20,y);ctx.globalAlpha=1;};
  tag(tgt(680)[0]+10,tgt(680)[1]+95,'红光 吸收','#c8402e',pAbs);tag(tgt(455)[0]-90,tgt(455)[1]+100,'蓝光 吸收','#2f52ad',pAbs);tag(60,1050,'绿光 弹回眼睛','#2e7d40',Q.eo(Q.seg(t,4,4.5)));
  // title on paper card
  paper(()=>{ctx.beginPath();ctx.roundRect(60,110,640,330,18);},'#fffaf1',16);
  ctx.font='700 26px "Noto Sans CJK SC"';ctx.fillStyle='#c9773a';ctx.fillText('自然科学 · 第 1 集',100,180);
  ctx.font='900 84px "Noto Serif CJK SC"';ctx.fillStyle='#2b2620';ctx.fillText('叶子为什么',100,290);ctx.fillText('是绿的？',100,395);
  // caption
  ctx.font='800 46px "Noto Sans CJK SC"';ctx.fillStyle='#fffaf0';ctx.fillText('红光蓝光被吃掉，',80,1530);ctx.fillText('绿光被弹回你的眼睛',80,1595);
  if(UI)Q.ui(ctx,false);
};
</script></body></html>
